<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WarungKu - Laporan Penjualan</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo-warungku.png">
    <link rel="manifest" href="manifest.json">

    <!-- Meta PWA & iOS Safari -->
    <meta name="theme-color" content="#e06d53">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WarungKu">
    <link rel="apple-touch-icon" href="images/logo.png">
</head>
<body>
    <div class="container">
        <h1>📊 Laporan Penjualan</h1>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">📦 Inventori</a>
            <a href="cashier.html" class="nav-link">🛒 Kasir</a>
            <a href="history.html" class="nav-link">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link active">📊 Laporan</a>
        </nav>

        <section class="dashboard">
            <div class="stat-card">
                <p>Total Pendapatan</p>
                <h2 id="totalRevenue">Rp 0</h2>
            </div>
            <div class="stat-card">
                <p>Total Transaksi</p>
                <h2 id="totalTransactions">0</h2>
            </div>
            <div class="stat-card">
                <p>Barang Terjual</p>
                <h2 id="totalItemsSold">0</h2>
            </div>
            <div class="stat-card">
                <p>Produk Terlaris</p>
                <h2 id="bestSeller">-</h2>
            </div>
        </section>

        <section class="report-box">
            <h2>📋 Riwayat Ringkas</h2>
            <div id="reportList"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="report.js"></script>
</body>
</html>
