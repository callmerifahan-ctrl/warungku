<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WarungKu - Riwayat Transaksi</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WarungKu">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">
</head>
<body>
    <div class="container">
        <!-- Header Logo -->
        <div class="header-logo" style="text-align: center; margin-bottom: 20px;">
            <img src="image/logo-warungku.png" alt="WarungKu Logo" class="brand-logo">
            <h1>WarungKu</h1>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">📦 Inventori</a>
            <a href="cashier.html" class="nav-link">🛒 Kasir</a>
            <a href="history.html" class="nav-link active">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link">📊 Laporan</a>
        </nav>

        <div class="sort-box">
            <label for="searchInput">🔍 Cari Transaksi:</label>
            <input type="text" id="searchInput" placeholder="Cari kode transaksi...">
        </div>

        <div class="list-box">
            <h2>📋 Riwayat Transaksi</h2>
            <div id="transactionList"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="history.js?v=3.0"></script>
</body>
</html>
