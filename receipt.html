<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Struk Transaksi - WarungKu</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo-warungku.png">
    <link rel="manifest" href="manifest.json">

    <!-- Meta PWA & iOS Safari -->
    <meta name="theme-color" content="#e06d53">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WarungKu">
    <link rel="apple-touch-icon" href="images/logo.png">
</head>
<body>
    <div class="receipt-container">
        <!-- Logo Struk -->
        <div class="receipt-header" style="text-align: center; margin-bottom: 15px;">
            <img src="images/logo.png" alt="WarungKu Logo" style="width: 70px; height: 70px; object-fit: contain;">
            <h2>WarungKu</h2>
            <p>Toko Kelontong</p>
        </div>

        <hr>

        <!-- Detail Struk -->
        <div id="receiptDetail">
            <p>Kode Transaksi: <span id="receiptCode">-</span></p>
            <p>Tanggal: <span id="receiptDate">-</span></p>
            <hr>
            <div id="receiptItems"></div>
            <hr>
            <p>Total: <strong id="receiptTotal">Rp 0</strong></p>
            <p>Bayar: <span id="receiptPayment">Rp 0</span></p>
            <p>Kembali: <span id="receiptChange">Rp 0</span></p>
        </div>

        <div class="receipt-actions" style="margin-top: 20px; text-align: center;">
            <button onclick="window.print()">🖨️ Cetak Struk</button>
            <button onclick="window.location.href='cashier.html'">⬅ Kembali ke Kasir</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="receipt.js"></script>
</body>
</html>
