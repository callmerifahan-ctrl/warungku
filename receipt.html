<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Struk</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="receipt-container">

        <h1>🛒 WARUNGKU</h1>

        <h2>Toko Ibu Irma</h2>

        <p>Cirebon, Jawa Barat</p>

        <hr>

        <p>
            <strong>No Transaksi</strong>
        </p>

        <p id="receiptCode"></p>

        <p>
            <strong>Tanggal</strong>
        </p>

        <p id="receiptDate"></p>

        <hr>

        <div id="receiptItems"></div>

        <hr>

        <div class="receipt-summary">

            <p>
                Total Item :
                <span id="receiptTotalItems">0</span>
            </p>

            <p>
                Total :
                <span id="receiptTotal">Rp 0</span>
            </p>

            <p>
                Bayar :
                <span id="receiptPayment">Rp 0</span>
            </p>

            <p>
                Kembalian :
                <span id="receiptChange">Rp 0</span>
            </p>

        </div>

        <hr>

            <p class="thanks">
                Terima Kasih 🙏
            </p>

            <p class="thanks">
                Selamat Berbelanja Kembali
            </p>

            <hr>

            <p class="thanks">
                WarungKu POS
            </p>

            <p class="thanks">
                Version 1.0.0
            </p>
        <div class="receipt-buttons">

            <button id="printButton">

                🖨 Cetak

            </button>

            <button id="backButton">
                🛒 Transaksi Baru
            </button>

        </div>

    </div>

    <script src="receipt.js"></script>

</body>

</html>
