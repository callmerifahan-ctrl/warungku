<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WarungKu - Struk Pembayaran</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WarungKu">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">
</head>
<body>
    <div class="receipt-container">
        <div class="receipt-header">
            <img src="image/logo-warungku.png" alt="WarungKu Logo" class="brand-logo">
            <h2>WarungKu</h2>
            <p id="receiptDate" style="color: var(--text-muted); font-size: 13px; margin: 4px 0;"></p>
            <p id="receiptCode" style="font-weight: bold; margin: 4px 0;"></p>
        </div>

        <hr>

        <div id="receiptItems"></div>

        <hr>

        <div class="receipt-summary">
            <p><span>Total</span> <strong id="receiptTotal">Rp 0</strong></p>
            <p><span>Bayar</span> <span id="receiptPayment">Rp 0</span></p>
            <p><span>Kembali</span> <span id="receiptChange">Rp 0</span></p>
        </div>

        <hr>

        <div class="receipt-footer">
            <p>Terima kasih atas kunjungan Anda!</p>
        </div>

        <div class="receipt-buttons">
            <button type="button" id="btnPrint" class="btn btn-primary">🖨️ Cetak / Simpan</button>
            <button type="button" id="btnBack" class="btn btn-secondary">Kembali</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="receipt.js"></script>
</body>
</html>
