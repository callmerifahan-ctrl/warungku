<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detail Transaksi - WarungKu</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="transaction-detail.css">

</head>

<body>

    <nav class="main-nav">

                    <a href="index.html" class="nav-link">
                        📦 Inventori
                    </a>

                    <a href="cashier.html" class="nav-link">
                        🛒 Kasir
                    </a>

                    <a href="history.html" class="nav-link">
                        📋 Riwayat Transaksi
                    </a>

                    <a href="report.html" class="nav-link">
                        📊 Laporan
                    </a>

                </nav>

    <main class="detail-container">

        <header class="detail-header">

            <button id="backButton" type="button">
                ← Kembali
            </button>

            <h1>📋 Detail Transaksi</h1>

        </header>

        <section class="transaction-info">

            <h2 id="transactionCode">-</h2>
            <p id="transactionDate">-</p>

        </section>

        <section class="items-section">

            <h3>Daftar Barang</h3>

            <div id="transactionItems"></div>

        </section>

        <section class="summary-section">

            <h3>💰 Ringkasan Pembayaran</h3>            

            <div>
                <span>Total Item</span>
                <strong id="totalItems">0</strong>
            </div>

            <div>
                <span>Total</span>
                <strong id="transactionTotal">Rp0</strong>
            </div>

            <div>
                <span>Pembayaran</span>
                <strong id="transactionPayment">Rp0</strong>
            </div>

            <div>
                <span>Kembalian</span>
                <strong id="transactionChange">Rp0</strong>
            </div>

        </section>

    </main>

    <script src="transaction-detail.js"></script>

</body>

</html>
