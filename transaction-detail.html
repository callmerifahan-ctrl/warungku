<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WarungKu - Detail Transaksi</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WarungKu">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">
</head>
<body>
    <div class="container">
        <nav class="main-nav">
            <a href="index.html" class="nav-link">📦 Inventori</a>
            <a href="cashier.html" class="nav-link">🛒 Kasir</a>
            <a href="history.html" class="nav-link">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link">📊 Laporan</a>
        </nav>

        <main class="detail-container">
            <header class="detail-header">
                <button id="backButton" class="btn-kembali">⬅ Kembali</button>
                <h1>📋 Detail Transaksi</h1>
            </header>

            <section class="transaction-info">
                <h2 id="transactionCode">-</h2>
                <p id="transactionDate">-</p>
            </section>

            <section class="items-section">
                <h3>Daftar Barang</h3>
                <div id="transactionItems"></div>
            </section>

            <section class="summary-section">
                <h3>💳 Ringkasan Pembayaran</h3>            
                <div>
                    <span>Total Item</span>
                    <strong id="totalItems">0</strong>
                </div>
                <div>
                    <span>Total</span>
                    <strong id="transactionTotal">Rp0</strong>
                </div>
                <div>
                    <span>Pembayaran</span>
                    <strong id="transactionPayment">Rp0</strong>
                </div>
                <div>
                    <span>Kembalian</span>
                    <strong id="transactionChange">Rp0</strong>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="transaction-detail.js"></script>
</body>
</html>
