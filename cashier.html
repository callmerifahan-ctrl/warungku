<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KlontongIn - Kasir</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo-warungku.png">
    
    <!-- Meta PWA & iOS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D67A67">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KlontongIn">
    <link rel="apple-touch-icon" href="image/logo-warungku.png">
</head>
<body>
    <div class="container">
        <!-- Header Logo -->
        <div class="header-logo" style="text-align: center; margin-bottom: 20px;">
            <img src="image/logo-warungku.png" alt="KlontongIn Logo" class="brand-logo">
            <h1>KlontongIn - Kasir</h1>
        </div>

        <nav class="main-nav">
            <a href="index.html" class="nav-link">📦 Inventori</a>
            <a href="cashier.html" class="nav-link active">🛒 Kasir</a>
            <a href="history.html" class="nav-link">📋 Riwayat Transaksi</a>
            <a href="report.html" class="nav-link">📊 Laporan</a>
        </nav>

        <div class="cashier-layout">
            <div class="cashier-box">
                <h2>Daftar Barang</h2>
                <button type="button" id="btnScanCashier" class="btn btn-primary">
                    📷 Scan Barang
                </button>
                <div id="cashierItems"></div>
            </div>

            <div class="cart-box">
                <h2>Keranjang</h2>
                <div id="cartItems"></div>

                <hr>

                <div class="cart-summary">
                    <h3>Total</h3>
                    <h3 id="cartTotal" class="total-amount">Rp 0</h3>
                </div>

                <div class="payment-group">
                    <label for="paymentInput"><strong>Pembayaran</strong></label>
                    <input id="paymentInput" type="number" placeholder="Masukkan uang pelanggan">
                </div>

                <div class="change-group">
                    <label><strong>Kembalian</strong></label>
                    <h3 id="changeTotal">Rp 0</h3>
                </div>

                <button id="checkoutButton" class="btn btn-success">
                    💳 Bayar
                </button>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="scanner-modal">
        <div class="scanner-box">
            <h3>📷 Arahkan kamera ke barcode</h3>
            <div id="scannerReader"></div>
            <button type="button" id="btnCloseScanner" class="btn btn-secondary">
                Batal
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" crossorigin="anonymous"></script>
    <script src="cashier.js?v=2.0"></script>
</body>
</html>
